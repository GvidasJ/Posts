<title>Poll Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F3ED; --card:#FFFFFF; --edge:#E2DED2; --edge-2:#CFC9B8;
  --ink:#1B1A16; --ink-2:#57544A; --ink-3:#8A8578;
  --accent:#14614C; --accent-soft:#DCEBE3; --accent-ink:#0C4536;
  --rust:#9A4715; --rust-soft:#F4E5D8;
  --shadow:0 1px 2px rgba(27,26,22,.05), 0 6px 16px -8px rgba(27,26,22,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16161A; --card:#1E1E23; --edge:#2E2E36; --edge-2:#3D3D48;
    --ink:#F0EEE8; --ink-2:#AEAAA0; --ink-3:#7C786F;
    --accent:#5FC5A4; --accent-soft:#183A31; --accent-ink:#8FDCC1;
    --rust:#D98B57; --rust-soft:#39281C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#16161A; --card:#1E1E23; --edge:#2E2E36; --edge-2:#3D3D48;
  --ink:#F0EEE8; --ink-2:#AEAAA0; --ink-3:#7C786F;
  --accent:#5FC5A4; --accent-soft:#183A31; --accent-ink:#8FDCC1;
  --rust:#D98B57; --rust-soft:#39281C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
header{padding:44px 0 22px; border-bottom:1px solid var(--edge)}
.kicker{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin:0 0 10px;
}
h1{
  font-size:clamp(34px,5.4vw,52px); line-height:1.02; margin:0;
  font-weight:800; letter-spacing:-.028em; text-wrap:balance;
}
.sub{margin:12px 0 0; color:var(--ink-2); max-width:62ch}
.stats{display:flex; flex-wrap:wrap; gap:26px; margin-top:24px}
.stat b{
  display:block; font-size:26px; font-weight:800; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1.1;
}
.stat span{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.bar{
  position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--edge); padding:14px 0;
}
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
input[type=search],select{
  font:inherit; font-size:14px; color:var(--ink); background:var(--card);
  border:1px solid var(--edge-2); border-radius:8px; padding:9px 12px;
}
input[type=search]{flex:1 1 260px; min-width:0}
input[type=search]::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.seg{display:flex; border:1px solid var(--edge-2); border-radius:8px; overflow:hidden; background:var(--card)}
.seg button{
  font:inherit; font-size:13px; font-weight:600; border:0; background:transparent;
  color:var(--ink-2); padding:9px 14px; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--edge-2)}
.seg button[aria-pressed=true]{background:var(--accent); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#0E1F1A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#0E1F1A}}
.count{margin-left:auto; font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
main{padding:26px 0 80px}
.batchhead{
  display:flex; align-items:baseline; gap:12px; margin:30px 0 12px;
  padding-bottom:8px; border-bottom:1px solid var(--edge);
}
.batchhead h2{font-size:15px; margin:0; font-weight:700; letter-spacing:-.01em}
.batchhead span{font-size:12px; color:var(--ink-3)}
.list{display:grid; gap:10px}
.poll{
  background:var(--card); border:1px solid var(--edge); border-radius:12px;
  padding:14px 16px; box-shadow:var(--shadow); display:grid; gap:10px;
}
.top{display:flex; gap:12px; align-items:flex-start}
.num{
  font-family:"DM Mono",ui-monospace,monospace; font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; padding-top:3px; min-width:34px;
}
.q{
  font-family:"DM Mono",ui-monospace,monospace; font-weight:500; font-size:14px;
  letter-spacing:.005em; line-height:1.45; margin:0; flex:1;
}
.copy{
  font:inherit; font-size:12px; font-weight:600; color:var(--ink-2);
  background:transparent; border:1px solid var(--edge-2); border-radius:7px;
  padding:5px 10px; cursor:pointer; white-space:nowrap;
}
.copy:hover{border-color:var(--accent); color:var(--accent)}
.copy.done{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.opts{display:flex; flex-wrap:wrap; gap:6px; padding-left:46px}
.opt{
  font-family:"DM Mono",ui-monospace,monospace; font-size:12px;
  border:1px solid var(--edge-2); border-radius:999px; padding:4px 10px; color:var(--ink-2);
}
.opt.ok{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); font-weight:500}
.meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-left:46px}
.chip{
  font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  border-radius:5px; padding:3px 7px; background:var(--paper); color:var(--ink-3);
  border:1px solid var(--edge);
}
.chip.img{background:var(--rust-soft); color:var(--rust); border-color:transparent}
.note{font-size:12px; color:var(--ink-3); padding-left:46px; line-height:1.45}
.empty{text-align:center; color:var(--ink-3); padding:70px 0}
@media(max-width:640px){
  .opts,.meta,.note{padding-left:0}
  .count{width:100%; margin:2px 0 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <p class="kicker">YouTube Community Posts</p>

</header>
</div>

<div class="bar"><div class="wrap"><div class="controls">
  <input type="search" id="q" placeholder="Search questions and answers…" aria-label="Search polls">

  <select id="batch" aria-label="Batch"><option value="">All batches</option></select>
  <span class="count" id="count"></span>
</div></div></div>

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let fmt='all';

TYPES.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;$('#type').append(o)});
BATCHES.forEach(b=>{const o=document.createElement('option');o.value=b.n;o.textContent='Batch '+b.n+' — '+b.l;$('#batch').append(o)});

function render(){
  const q=$('#q').value.trim().toLowerCase(), ty=$('#type').value, ba=$('#batch').value;
  const hit=POLLS.filter(p=>{
    if(fmt!=='all'&&p.f!==fmt)return false;
    if(ty&&p.t!==ty)return false;
    if(ba&&String(p.b)!==ba)return false;
    if(q&&!(p.q+' '+p.o.join(' ')).toLowerCase().includes(q))return false;
    return true;
  });
  $('#count').textContent=hit.length+' of '+POLLS.length;
  if(!hit.length){$('#out').innerHTML='<p class="empty">No polls match that. Try a shorter search.</p>';return}
  let html='',cur=null;
  hit.forEach(p=>{
    if(p.b!==cur){
      if(cur!==null)html+='</div>';
      cur=p.b;
      const b=BATCHES.find(x=>x.n===p.b)||{l:''};
      html+='<div class="batchhead"><h2>Batch '+p.b+'</h2><span>'+esc(b.l)+'</span></div><div class="list">';
    }
    const opts=p.o.map(o=>'<span class="opt'+(p.c&&p.c.replace(' ✅','').trim()===o.trim()?' ok':'')+'">'+esc(o)+'</span>').join('');
    html+='<article class="poll"><div class="top"><span class="num">'+p.n+'</span>'+
      '<p class="q">'+esc(p.q)+'</p>'+
      '<button class="copy" data-n="'+p.n+'">Copy</button></div>'+
      '<div class="opts">'+opts+'</div>'+
      '<div class="meta"><span class="chip">'+esc(p.t)+'</span>'+
      (p.f==='image'?'<span class="chip img">Needs images</span>':'<span class="chip">Text only</span>')+'</div>'+
      (p.img?'<p class="note">'+esc(p.img)+'</p>':'')+
      '</article>';
  });
  html+='</div>';
  $('#out').innerHTML=html;
}

$('#out').addEventListener('click',e=>{
  const b=e.target.closest('.copy'); if(!b)return;
  const p=POLLS.find(x=>x.n===+b.dataset.n);
  navigator.clipboard.writeText(p.q+'\n'+p.o.join('\n')).then(()=>{
    b.textContent='Copied'; b.classList.add('done');
    setTimeout(()=>{b.textContent='Copy';b.classList.remove('done')},1400);
  });
});

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
